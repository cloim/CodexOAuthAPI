services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-oauth-api:latest
    container_name: codex-oauth-api
    restart: unless-stopped
    ports:
      - "47340:8000"
    volumes:
      - codex-oauth-api-state:/state
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - CODEX_OAUTH_API_STATE_ROOT=/state
      - CODEX_OAUTH_API_HOST=0.0.0.0
      - CODEX_OAUTH_API_ALLOWED_IPS=127.0.0.1,::1,218.39.10.163,172.16.0.1,172.17.0.1,172.18.0.1,172.19.0.1,172.20.0.1,172.21.0.1,172.22.0.1,172.23.0.1,172.24.0.1,172.25.0.1,172.26.0.1,172.27.0.1,172.28.0.1,172.29.0.1,172.30.0.1,172.31.0.1

volumes:
  codex-oauth-api-state:
    external: true
